[package]
name = "pardeh"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "native server-rendered pages for axum with signal-driven regions"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[profile.release]
strip = true
lto = true
